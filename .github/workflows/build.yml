name: CI
on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
    branches: ['**']
permissions:
  contents: read
jobs:
  linux:
    name: test (${{ matrix.preset }})
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        preset: [ethercat-ci, development, headless]
    steps:
      - uses: actions/checkout@v4
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build pkg-config libeigen3-dev libyaml-cpp-dev python3-yaml python3-venv
          python3 -m venv --system-site-packages .cache/test-venv
          .cache/test-venv/bin/pip install -r tests/requirements.txt
      - name: Configure
        run: cmake --preset ${{ matrix.preset }} -DPython3_EXECUTABLE="$PWD/.cache/test-venv/bin/python"
      - name: Build
        run: cmake --build --preset ${{ matrix.preset }} --parallel 2
      - name: Test
        run: ctest --preset ${{ matrix.preset }}
