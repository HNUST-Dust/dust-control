schema_version: 3
motors: motors_params.yaml
execution:
  simulate: false
  realtime: true
  enable_output: false
ethercat:
  pdo_file: ethercat_pdo.yaml
  thread: {cpu: 3, priority: 80}
adapters:
  base:
    uart_sensors: {remote: 1, hi91: 2, referee: 3}
    strict_hi91_crc: false
modules:
  chassis:
    enabled: true
    sensor_adapter: base
    thread: {cpu: 3, priority: 80}
  gimbal:
    enabled: true
    adapter: null
    thread: {cpu: null, priority: 0}
  ui:
    enabled: true
    adapter: base
    thread: {cpu: null, priority: 0}
