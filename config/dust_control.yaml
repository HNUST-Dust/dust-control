schema_version: 3
motors: motors_params.yaml
execution:
  simulate: false
  realtime: true
  enable_output: false
ethercat:
  master_index: 0
  cycle_time_us: 125
  # Planning guards, not verified HPM5E31 ESC resource limits.
  limits: {max_rxpdo_bytes: 4096, max_txpdo_bytes: 4096, max_wire_time_us: 125}
  thread: {cpu: 3, priority: 80}
adapters:
  base:
    alias: 0
    position: 0
    # Replace with actual registered slave identity. Zero prevents hardware startup.
    vendor_id: 0
    product_code: 0
    uart_sensors: {remote: 5, hi91: 2, referee: null}
    strict_hi91_crc: false
modules:
  chassis:
    enabled: true
    sensor_adapter: base
    thread: {cpu: 3, priority: 80}
  gimbal:
    enabled: true
    adapter: null
    thread: {cpu: null, priority: 0}
  ui:
    enabled: true
    adapter: base
    thread: {cpu: null, priority: 0}
