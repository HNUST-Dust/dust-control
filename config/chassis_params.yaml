  left_spring_force_n: 300.0
  right_spring_force_n: 300.0
  left_spring_upper_offset_m: 0.05
  right_spring_upper_offset_m: -0.05
  spring_lower_distance_m: 0.05
support_force_estimator:
  wheel_mass_kg: 0.6
flight:
  airborne_push_force_n: 80.0
jump:
  thrust_torque_nm: 30.0
vmc:
  leg_length_kp: 600.0
  leg_length_ki: 100.0
  leg_length_kd: 120.0
  integral_force_limit_n: 60.0
  force_limit_n: 200.0
actuator:
  joint_torque_limit_nm: 54.0
safety:
  tilt_cutoff_deg: 75.0
hardware:
  left:
    leg_angle_offset_rad: -0.036063
  right:
    leg_angle_offset_rad: -3.12101
