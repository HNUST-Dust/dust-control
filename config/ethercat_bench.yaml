# 实验台架专用；只供 dust_ethercat_discover，生产运行时仍拒绝 VID=0。
schema_version: 1
ethercat:
  master_index: 0
  cycle_time_us: 1000
  limits:
    max_rxpdo_bytes: 1024
    max_txpdo_bytes: 1536
    max_wire_time_us: 800
adapters:
  bench:
    alias: 0
    position: 0
    vendor_id: 0
    product_code: 0x44544331
    pdo:
      can:
        tx_slots: {chassis: 0, gimbal: 0}
        rx_slots: {0: 2, 1: 2, 2: 2, 3: 2}
      uart:
        5: {tx_bytes: 0, rx_bytes: 32}
        6: {tx_bytes: 0, rx_bytes: 64}
      onboard_imu: false
