# 仅接收台架：显式使用 --receive-only，所有 CAN/UART TX 容量为 0。
# CAN2 暂跳过；HI91 UART2=921600（固件 overlay），SBUS UART5=100000/8E2。
schema_version: 1
ethercat:
  master_index: 0
  cycle_time_us: 1000
  limits:
    max_rxpdo_bytes: 1024
    max_txpdo_bytes: 1536
    max_wire_time_us: 800
adapters:
  bench:
    alias: 0
    position: 0
    vendor_id: 0
    product_code: 0x44544331
    pdo:
      can:
        tx_slots: {chassis: 0, gimbal: 0}
        rx_slots: {0: 0, 1: 0, 2: 0, 3: 2}
      uart:
        5: {tx_bytes: 0, rx_bytes: 32}
        2: {tx_bytes: 0, rx_bytes: 128}
      onboard_imu: false
